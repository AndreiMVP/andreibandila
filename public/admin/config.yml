# Configurare Decap CMS.
# Pentru editare locală: `npx decap-server`, apoi deschide /admin.
# Pentru producție, configurează un backend Git cu autentificare.

backend:
  name: git-gateway
  branch: main

local_backend: true
publish_mode: editorial_workflow
site_url: /
display_url: /

media_folder: public/photos/uploads
public_folder: /photos/uploads

collections:
  - name: albums
    label: Albume
    label_singular: Album
    folder: content/albums
    extension: json
    format: json
    create: true
    slug: "{{id}}"
    identifier_field: title
    fields:
      - { name: id, label: ID, widget: string, hint: "Identificator stabil pentru URL, ex. timisoara" }
      - { name: title, label: Titlu, widget: string }
      - { name: subtitle, label: Subtitlu, widget: string, required: false }
      - { name: year, label: An, widget: string }
      - { name: location, label: Loc, widget: string }
      - { name: cover, label: Copertă, widget: image }
      - { name: count, label: Număr fotografii, widget: number, value_type: int }
      - { name: description, label: Descriere, widget: text }
      - name: photos
        label: Fotografii
        widget: list
        summary: "{{fields.caption}}"
        fields:
          - { name: src, label: Imagine, widget: image }
          - { name: caption, label: Legendă, widget: string }

  - name: films
    label: Filme
    label_singular: Film
    folder: content/films
    extension: json
    format: json
    create: true
    slug: "{{id}}"
    identifier_field: title
    fields:
      - { name: id, label: ID, widget: string }
      - { name: title, label: Titlu, widget: string }
      - { name: subtitle, label: Subtitlu, widget: string }
      - { name: year, label: An, widget: string }
      - { name: duration, label: Durată, widget: string }
      - { name: role, label: Rol, widget: string }
      - { name: status, label: Stadiu, widget: string }
      - { name: cover, label: Copertă, widget: image }
      - { name: poster, label: URL poster, widget: string, required: false }
      - name: festivals
        label: Festivaluri
        widget: list
        field: { name: item, label: Festival, widget: string }
      - { name: synopsis, label: Sinopsis, widget: text }
      - name: stills
        label: Cadre
        widget: list
        summary: "{{fields.caption}}"
        fields:
          - { name: src, label: Imagine, widget: image }
          - { name: caption, label: Legendă, widget: string }

  - name: journal
    label: Jurnal
    label_singular: Articol
    folder: content/journal
    extension: json
    format: json
    create: true
    slug: "{{id}}"
    identifier_field: title
    fields:
      - { name: id, label: ID, widget: string }
      - { name: kind, label: Tip, widget: select, options: ["eseu", "notă"] }
      - { name: title, label: Titlu, widget: string }
      - { name: date, label: Dată, widget: string }
      - { name: readTime, label: Timp de citire, widget: string }
      - { name: excerpt, label: Rezumat, widget: text }
      - name: body
        label: Paragrafe
        widget: list
        field: { name: paragraph, label: Paragraf, widget: text }

  - name: settings
    label: Setări
    files:
      - name: about
        label: Text despre autor
        file: content/about.json
        extension: json
        format: json
        fields:
          - name: paragraphs
            label: Paragrafe
            widget: list
            field: { name: paragraph, label: Paragraf, widget: text }
